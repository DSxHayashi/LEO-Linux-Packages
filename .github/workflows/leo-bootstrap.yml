
name: LEO Bootstrap Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bootstrap ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - arm
          - i686
          - x86_64

    steps:
      - name: Checkout LEO packages
        uses: actions/checkout@v4

      - name: Generate bootstrap
        run: |
          ./scripts/run-docker.sh \
            ./scripts/generate-bootstraps.sh \
            --architectures "${{ matrix.arch }}"

      - name: Locate bootstrap ZIP
        run: |
          echo "Current directory:"
          pwd
          echo "ZIP files found:"
          find . -type f -name '*.zip' -print
          echo "Root directory:"
          ls -lah

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leo-bootstrap-${{ matrix.arch }}
          path: |
            **/bootstrap-*.zip
            **/bootstrap-*-output.zip
          if-no-files-found: error
          
