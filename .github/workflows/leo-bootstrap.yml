
name: LEO Bootstrap Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bootstrap ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - arm
          - i686
          - x86_64

    steps:
      - name: Checkout LEO packages
        uses: actions/checkout@v4

      - name: Generate bootstrap
        run: |
          ./scripts/run-docker.sh \
            ./scripts/generate-bootstraps.sh \
            --architectures "${{ matrix.arch }}"

      
      
      
      
      - name: Extract bootstrap ZIP from Docker
        run: |
          mkdir -p output
          docker cp termux-package-builder:/tmp/leo-bootstrap-output/. ./output/
          find output -type f -name '*.zip' -print
          
          

          echo "=== Output directories ==="
          docker exec termux-package-builder \
            find /home/builder/termux-packages \
            -type d -name output -print
            
            

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leo-bootstrap-${{ matrix.arch }}
          path: |
            **/bootstrap-*.zip
            **/bootstrap-*-output.zip
          if-no-files-found: error
          
